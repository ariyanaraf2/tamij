<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Md Tamij</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='42' font-family='Poppins,Arial,sans-serif' font-weight='700' font-size='26' fill='%2306B6D4' text-anchor='middle'%3EMT%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--primary:#111827;--secondary:#2563EB;--accent:#06B6D4;--bg:#FFFFFF;--muted:#6B7280;--border:#E5E7EB;}
  @media (prefers-color-scheme: dark){:root{--primary:#F9FAFB;--bg:#0B1120;--muted:#94A3B8;--border:#1E293B;}}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
    background:var(--bg); color:var(--primary); font-family:'Inter',sans-serif; padding:24px;
  }
  .wrap{max-width:520px;}
  .code{font-family:'JetBrains Mono',monospace; color:var(--secondary); font-size:1rem; margin-bottom:18px;}
  h1{font-family:'Poppins',sans-serif; font-size:clamp(2.4rem,8vw,4rem); margin:0 0 16px; letter-spacing:-.02em;}
  p{color:var(--muted); font-size:1.05rem; margin-bottom:32px; line-height:1.6;}
  a{
    display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border-radius:999px;
    background:var(--secondary); color:#fff; text-decoration:none; font-weight:600; box-shadow:0 12px 32px rgba(37,99,235,.25);
    transition:transform .2s ease;
  }
  a:hover{transform:translateY(-2px);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">// Error 404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <a href="/">← Back to homepage</a>
  </div>
</body>
</html>
